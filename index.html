<title>ميقات</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="description" content="تطبيق ميقات التفاعلي — عدّاد الحصص الذكي مع تنبيهات صوتية واهتزاز وجدول رسمي يتبدّل تلقائيًا حسب يوم الأسبوع.">
<style>
  :root{
    --bg:#FAF9F4;
    --surface:#FFFFFF;
    --surface-2:#F1EEE3;
    --surface-3:#E9E5D6;
    --ink:#1E2724;
    --ink-muted:#5C675F;
    --ink-faint:#8B948C;
    --border:#E4E0D2;
    --accent:#0E6E5B;
    --accent-ink:#FFFFFF;
    --accent-soft:#E3F1EC;
    --amber:#B4740B;
    --amber-ink:#FFFFFF;
    --amber-soft:#FBEDD3;
    --danger:#AE4038;
    --danger-soft:#F7E4E1;
    --violet:#6C5FC2;
    --violet-soft:#EAE7F8;
    --shadow: 0 1px 2px rgba(30,39,36,.06), 0 10px 30px -14px rgba(30,39,36,.22);
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --bg:#0F1412;
      --surface:#161F1B;
      --surface-2:#1C2622;
      --surface-3:#243029;
      --ink:#ECEFEA;
      --ink-muted:#9DAAA2;
      --ink-faint:#6D7B73;
      --border:#293530;
      --accent:#54D6B0;
      --accent-ink:#052A21;
      --accent-soft:#173B32;
      --amber:#E7A845;
      --amber-ink:#2B1C02;
      --amber-soft:#3B2C13;
      --danger:#E3847A;
      --danger-soft:#3B211E;
      --violet:#A79AF0;
      --violet-soft:#251F42;
      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 30px -14px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0F1412;
    --surface:#161F1B;
    --surface-2:#1C2622;
    --surface-3:#243029;
    --ink:#ECEFEA;
    --ink-muted:#9DAAA2;
    --ink-faint:#6D7B73;
    --border:#293530;
    --accent:#54D6B0;
    --accent-ink:#052A21;
    --accent-soft:#173B32;
    --amber:#E7A845;
    --amber-ink:#2B1C02;
    --amber-soft:#3B2C13;
    --danger:#E3847A;
    --danger-soft:#3B211E;
    --violet:#A79AF0;
    --violet-soft:#251F42;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 30px -14px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;background:var(--bg);}
  body{
    margin:0;
    font-family:"IBM Plex Sans Arabic","Tahoma",sans-serif;
    color:var(--ink);
    background:var(--bg);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    padding-inline:0;
  }
  button,input,select,textarea{font-family:inherit;}
  button{cursor:pointer;}
  h1,h2,h3{font-family:"Cairo",sans-serif;margin:0;}

  #root{min-height:100%;display:flex;justify-content:center;padding-block:0;}

  .frame{
    width:100%;max-width:430px;min-height:100vh;min-height:100dvh;
    background:var(--bg);
    display:flex;flex-direction:column;
    position:relative;
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (min-width:560px){
    #root{padding-block:28px;}
    .frame{min-height:840px;height:840px;border-radius:28px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--border);}
  }

  /* ---------- gate screen ---------- */
  .gate{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
    text-align:center;padding:22px 24px 18px;
    background:radial-gradient(600px 320px at 50% -10%, var(--accent-soft), transparent 65%);
  }
  .gate-school{
    display:flex;align-items:center;gap:10px;flex:0 0 auto;
  }
  .gate-school img{width:38px;height:38px;border-radius:9px;display:block;}
  .gate-school .name{
    font-family:"Cairo",sans-serif;font-weight:700;font-size:13.5px;color:var(--ink-muted);
  }
  .gate-main{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:18px;padding-block:14px;
  }
  .gate .mark{
    width:100px;height:100px;border-radius:26px;background:var(--accent);color:var(--accent-ink);
    display:flex;align-items:center;justify-content:center;font-size:46px;box-shadow:var(--shadow);
  }
  .gate h1{font-size:32px;font-weight:800;}
  .gate p{color:var(--ink-muted);font-size:16.5px;max-width:32ch;margin:0;}
  .gate .go{
    margin-top:10px;background:var(--accent);color:var(--accent-ink);border:none;
    font-family:"Cairo",sans-serif;font-weight:700;font-size:18px;
    padding:16px 46px;border-radius:14px;box-shadow:var(--shadow);
  }
  .gate .hint{font-size:13.5px;color:var(--ink-faint);margin-top:2px;}
  .gate .credits{
    margin-top:6px;padding-top:20px;border-top:1px dashed var(--border);
    display:flex;flex-direction:column;gap:16px;width:100%;max-width:280px;
  }
  .gate .credits .item .lbl{font-size:11.5px;color:var(--ink-faint);margin-bottom:3px;}
  .gate .credits .item .val{font-size:15px;font-weight:700;color:var(--ink-muted);}
  .gate .credits .item.principal .val{font-family:"Cairo",sans-serif;font-size:20px;font-weight:800;color:var(--ink);}
  .gate-footer{
    flex:0 0 auto;font-size:11px;color:var(--ink-faint);padding-top:10px;
  }

  /* ---------- header ---------- */
  .header{
    position:sticky;top:env(safe-area-inset-top,0px);z-index:5;
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px;border-bottom:1px solid var(--border);
    background:color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter:blur(6px);
  }
  .header .brand{display:flex;align-items:center;gap:9px;}
  .header .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);}
  .header .brand b{font-family:"Cairo",sans-serif;font-weight:800;font-size:18px;}
  .header .clock{
    font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
    font-size:13px;color:var(--ink-muted);margin-top:2px;
  }
  .header .actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
  .icon-btn{
    width:42px;height:42px;border-radius:12px;border:1px solid var(--border);
    background:var(--surface-2);color:var(--ink);
    display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto;
  }
  .icon-btn.active{background:var(--accent-soft);border-color:transparent;color:var(--accent);}
  .icon-btn.muted{background:var(--danger-soft);border-color:transparent;color:var(--danger);}

  .content{flex:1;overflow-y:auto;padding:20px 18px 32px;display:flex;flex-direction:column;gap:16px;}

  .demo-strip{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--violet-soft);border:1px solid color-mix(in srgb, var(--violet) 35%, transparent);
    color:var(--violet);padding:11px 15px;border-radius:12px;font-size:14px;font-weight:600;
  }
  .demo-strip button{
    background:var(--violet);color:#fff;border:none;border-radius:9px;
    padding:7px 14px;font-size:13px;font-weight:700;
  }

  /* ---------- state screens (weekend / waiting / done) ---------- */
  .state-screen{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;gap:10px;padding:28px 10px;min-height:340px;
  }
  .state-screen .icon{
    width:76px;height:76px;border-radius:20px;display:flex;align-items:center;justify-content:center;
    font-size:36px;margin-bottom:8px;
  }
  .state-screen h2{font-size:22px;}
  .state-screen p{color:var(--ink-muted);font-size:15.5px;max-width:30ch;margin:0;}
  .state-screen .countdown{
    font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
    font-size:42px;font-weight:600;color:var(--accent);margin-top:4px;
  }
  .ghost-btn{
    margin-top:16px;background:transparent;border:1px solid var(--border);color:var(--ink-muted);
    font-size:14.5px;font-weight:600;padding:11px 20px;border-radius:12px;
  }

  /* ---------- event card ---------- */
  .event-card{
    background:var(--surface);border:1px solid var(--border);border-radius:20px;
    padding:26px 20px 22px;box-shadow:var(--shadow);
    display:flex;flex-direction:column;align-items:center;gap:14px;
    transition:border-color .3s, background .3s;
  }
  .event-card.alerting{border-color:color-mix(in srgb, var(--amber) 55%, transparent);background:var(--amber-soft);}
  .type-chip{
    display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;
    background:var(--surface-2);border:1px solid var(--border);color:var(--ink-muted);
    padding:6px 15px;border-radius:999px;
  }
  .event-card.alerting .type-chip{background:var(--amber);color:var(--amber-ink);border-color:transparent;}

  .ring-wrap{position:relative;width:min(74vw,240px);height:min(74vw,240px);}
  .ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg);}
  .ring-center{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  }
  .ring-center .timer{
    font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
    font-size:clamp(40px,11vw,52px);font-weight:700;letter-spacing:-.02em;
  }
  .ring-center .label{font-size:13.5px;color:var(--ink-muted);}

  .event-name{font-family:"Cairo",sans-serif;font-weight:800;font-size:23px;text-align:center;}

  .next-strip{
    width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--surface-2);border:1px solid var(--border);border-radius:13px;
    padding:13px 16px;font-size:14.5px;
  }
  .next-strip .lbl{color:var(--ink-faint);font-size:12.5px;}
  .next-strip .val{font-weight:700;margin-top:1px;}
  .next-strip .time{
    font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;color:var(--ink-muted);font-size:14px;
  }

  /* ---------- ending banner ---------- */
  .banner{
    position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px);z-index:4;
    margin:0 18px;background:var(--amber);color:var(--amber-ink);
    border-radius:13px;padding:13px 16px;box-shadow:var(--shadow);
    display:flex;align-items:center;gap:10px;font-size:14.5px;font-weight:700;
    animation:slidein .25s ease;
  }
  @keyframes slidein{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}

  /* ---------- ended overlay ---------- */
  .overlay-backdrop{
    position:fixed;inset:0;background:rgba(10,14,12,.55);backdrop-filter:blur(2px);
    display:flex;align-items:center;justify-content:center;z-index:20;padding:24px;
  }
  .overlay-card{
    background:var(--surface);border-radius:22px;padding:30px 26px;max-width:340px;width:100%;
    text-align:center;box-shadow:var(--shadow);border:1px solid var(--border);
    animation:pop .25s ease;
  }
  @keyframes pop{from{opacity:0;transform:scale(.92);}to{opacity:1;transform:scale(1);}}
  .overlay-card .bell{
    width:80px;height:80px;border-radius:50%;background:var(--amber-soft);color:var(--amber);
    display:flex;align-items:center;justify-content:center;font-size:38px;margin:0 auto 16px;
    animation:ring 1.1s ease infinite;
  }
  @keyframes ring{0%,100%{transform:rotate(0);}20%{transform:rotate(-14deg);}40%{transform:rotate(11deg);}60%{transform:rotate(-7deg);}80%{transform:rotate(4deg);}}
  .overlay-card h2{font-size:22px;margin-bottom:7px;}
  .overlay-card p{color:var(--ink-muted);font-size:15px;margin:0 0 20px;}
  .overlay-card .ok{
    width:100%;background:var(--accent);color:var(--accent-ink);border:none;
    font-family:"Cairo",sans-serif;font-weight:700;font-size:16px;padding:14px;border-radius:12px;
  }

  /* ---------- settings modal ---------- */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(10,14,12,.5);z-index:25;
    display:flex;align-items:flex-end;justify-content:center;
  }
  @media (min-width:560px){ .modal-backdrop{align-items:center;} }
  .modal{
    background:var(--surface);width:100%;max-width:430px;max-height:88vh;
    border-radius:22px 22px 0 0;display:flex;flex-direction:column;overflow:hidden;
    box-shadow:var(--shadow);border:1px solid var(--border);
  }
  @media (min-width:560px){ .modal{border-radius:20px;max-height:80vh;} }
  .modal-head{
    display:flex;align-items:center;justify-content:space-between;padding:16px 18px;
    border-bottom:1px solid var(--border);flex:0 0 auto;
  }
  .modal-head h2{font-size:19px;}
  .modal-body{overflow-y:auto;padding:18px 18px 28px;display:flex;flex-direction:column;gap:24px;font-size:15px;}

  .sec-title{font-size:13.5px;font-weight:700;color:var(--ink-faint);letter-spacing:.03em;text-transform:uppercase;margin-bottom:11px;}
  .field-row{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 0;border-bottom:1px solid var(--border);
  }
  .field-row:last-child{border-bottom:none;}
  .field-row .ft{font-size:15.5px;font-weight:600;}
  .field-row .fs{font-size:12.5px;color:var(--ink-faint);margin-top:1px;}
  .field-row input[type=range]{width:120px;accent-color:var(--accent);}
  .field-row .num{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--accent);font-weight:700;width:26px;text-align:center;}

  .switch{position:relative;width:42px;height:24px;flex:0 0 auto;}
  .switch input{opacity:0;width:0;height:0;}
  .switch .track{
    position:absolute;inset:0;background:var(--surface-3);border-radius:999px;transition:.2s;
  }
  .switch .track:before{
    content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;
    top:3px;right:3px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3);
  }
  .switch input:checked + .track{background:var(--accent);}
  .switch input:checked + .track:before{transform:translateX(-18px);}

  .type-toggles{display:flex;flex-wrap:wrap;gap:8px;}
  .type-toggle{
    display:flex;align-items:center;gap:7px;border:1px solid var(--border);border-radius:11px;
    padding:8px 12px;font-size:13px;font-weight:600;background:var(--surface-2);
  }
  .type-toggle input{accent-color:var(--accent);}

  .day-tabs{display:flex;gap:6px;background:var(--surface-2);padding:4px;border-radius:11px;}
  .day-tab{
    flex:1;text-align:center;padding:8px 6px;border-radius:8px;font-size:12.5px;font-weight:700;
    color:var(--ink-muted);border:none;background:transparent;
  }
  .day-tab.on{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.08);}

  .event-row{
    display:grid;grid-template-columns:1fr auto auto auto auto;gap:6px;align-items:center;
    padding:8px 0;border-bottom:1px solid var(--border);
  }
  .event-row:last-child{border-bottom:none;}
  .event-row input[type=text]{
    border:1px solid var(--border);border-radius:8px;padding:7px 8px;font-size:12.5px;
    background:var(--surface);color:var(--ink);width:100%;
  }
  .event-row input[type=time]{
    border:1px solid var(--border);border-radius:8px;padding:6px 5px;font-size:12px;
    background:var(--surface);color:var(--ink);width:82px;font-family:"IBM Plex Mono",monospace;
  }
  .event-row select{
    border:1px solid var(--border);border-radius:8px;padding:6px 4px;font-size:11.5px;
    background:var(--surface);color:var(--ink);
  }
  .row-del{
    width:26px;height:26px;border-radius:7px;border:1px solid var(--border);background:var(--surface);
    color:var(--danger);font-size:13px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  }
  .add-row{
    margin-top:8px;width:100%;border:1px dashed var(--border);background:transparent;color:var(--accent);
    font-weight:700;font-size:13px;padding:9px;border-radius:10px;
  }

  .btn-row{display:flex;gap:8px;flex-wrap:wrap;}
  .btn{
    flex:1;font-weight:700;font-size:13px;padding:11px 14px;border-radius:11px;border:1px solid var(--border);
    background:var(--surface-2);color:var(--ink);
  }
  .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;}
  .btn.danger{background:var(--danger-soft);color:var(--danger);border-color:transparent;}
  .btn.violet{background:var(--violet-soft);color:var(--violet);border-color:transparent;}

  textarea.json{
    width:100%;min-height:120px;border:1px solid var(--border);border-radius:10px;
    background:var(--code-bg,#14201C);color:#DCE8E2;font-family:"IBM Plex Mono",monospace;
    font-size:11.5px;padding:10px;direction:ltr;text-align:left;resize:vertical;
  }
  .note{font-size:11.5px;color:var(--ink-faint);line-height:1.6;}
  .err{font-size:12px;color:var(--danger);font-weight:600;}
  .ok-msg{font-size:12px;color:var(--accent);font-weight:600;}

  .foot-note{
    text-align:center;font-size:10.5px;color:var(--ink-faint);padding:4px 20px 0;
  }

  .event-personal{font-size:15px;font-weight:600;color:var(--accent);margin-top:-8px;text-align:center;}

  /* ---------- my schedule tab ---------- */
  .myschedule{display:flex;flex-direction:column;gap:20px;}
  .ms-head h2{font-size:20px;margin-bottom:4px;}
  .ms-head p{font-size:13.5px;color:var(--ink-muted);margin:0;line-height:1.6;}

  .ms-upload{
    border:1.5px dashed var(--border);border-radius:16px;padding:20px 16px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    text-align:center;background:var(--surface-2);
  }
  .ms-upload-icon{font-size:30px;}
  .ms-upload-title{font-weight:700;font-size:14.5px;}
  .ms-upload-hint{font-size:12px;color:var(--ink-faint);max-width:36ch;line-height:1.6;}
  .ms-scan-spin{
    width:34px;height:34px;border-radius:50%;border:3px solid var(--border);
    border-top-color:var(--accent);animation:msspin .8s linear infinite;
  }
  @keyframes msspin{to{transform:rotate(360deg);}}

  .tp-list{display:flex;flex-direction:column;gap:8px;}
  .tp-row{
    display:flex;align-items:center;gap:10px;
    background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:10px 12px;
  }
  .tp-row.off{opacity:.55;background:var(--surface-2);}
  .tp-time{flex:0 0 auto;width:76px;}
  .tp-num{font-size:12px;font-weight:700;color:var(--ink);}
  .tp-range{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-faint);}
  .tp-fields{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0;}
  .tp-fields input{
    border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13px;
    background:var(--surface);color:var(--ink);width:100%;
  }
  .tp-fields input:disabled{opacity:.5;}
  .tp-empty{
    flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:3px;
    font-size:10.5px;color:var(--ink-faint);font-weight:600;
  }
  .tp-empty input{accent-color:var(--accent);}

  .ms-chips{display:flex;flex-wrap:wrap;gap:7px;}
  .ms-chip{
    border:1px solid var(--border);background:var(--surface-2);color:var(--ink);
    font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:999px;
  }
</style>

<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<script>
(function(){
"use strict";
var h = React.createElement;

/* ============ helpers ============ */

function pad2(n){ return n < 10 ? "0"+n : ""+n; }

function riyadhNow(){
  try{ return new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Riyadh" })); }
  catch(e){ return new Date(); }
}

function fmtClock(d){
  return DAY_NAMES[d.getDay()] + " · " + pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + ":" + pad2(d.getSeconds());
}

function fmtCountdown(ms){
  var s = Math.max(0, Math.round(ms/1000));
  return pad2(Math.floor(s/60)) + ":" + pad2(s%60);
}

function fmtTime(hhmm){ return hhmm; }

function arabicMinutes(n){
  if(n === 1) return "دقيقة واحدة";
  if(n === 2) return "دقيقتان";
  return n + " دقائق";
}
function arabicSeconds(n){
  if(n === 1) return "ثانية واحدة";
  if(n === 2) return "ثانيتان";
  return n + " ثوانٍ";
}

// the teacher's personal timetable is keyed by actual weekday (0=Sunday..4=Thursday),
// not by the shared bell-schedule key, because mon_tue_wed shares one bell timing
// but the teacher's subject/class differ across Monday, Tuesday and Wednesday.
function periodsForWeekday(schedule, weekday){
  var key = DAY_TO_KEY[weekday];
  if(!key) return [];
  return (schedule[key] || []).filter(function(e){ return e.type === "period"; });
}

function personalFor(teacherSchedule, weekday, periodIdx){
  var day = teacherSchedule ? teacherSchedule[weekday] : null;
  if(!day) return null;
  var slot = day[periodIdx];
  if(!slot || slot.isEmpty) return null;
  var subj = (slot.subject || "").trim(), cls = (slot.className || "").trim();
  if(!subj || !cls) return null; // only replace the generic announcement once both are filled in
  return { subject: subj, className: cls };
}

function buildTodayEvents(schedule, nowDate, teacherSchedule){
  var key = DAY_TO_KEY[nowDate.getDay()];
  if(!key) return { key: null, events: [] };
  var list = schedule[key] || [];
  var y = nowDate.getFullYear(), m = nowDate.getMonth(), d = nowDate.getDate();
  var weekday = nowDate.getDay();
  var periodCounter = 0;
  var events = list.map(function(ev, idx){
    var sp = ev.start.split(":"), ep = ev.end.split(":");
    var startMs = new Date(y, m, d, +sp[0], +sp[1], 0, 0).getTime();
    var endMs = new Date(y, m, d, +ep[0], +ep[1], 0, 0).getTime();
    var personal = null;
    if(ev.type === "period"){
      personal = teacherSchedule ? personalFor(teacherSchedule, weekday, periodCounter) : null;
      periodCounter++;
    }
    return { name: ev.name, type: ev.type, start: ev.start, end: ev.end, id: key+"-"+idx, startMs: startMs, endMs: endMs, personal: personal };
  });
  return { key: key, events: events };
}

function buildDemoEvents(startDate){
  var base = startDate.getTime();
  var plan = [
    { name:"حصة تجريبية",         type:"period",   offset:0,  duration:25, leadSec:8, personal:{ subject:"الرياضيات", className:"الرابع أ" } },
    { name:"الفسحة",              type:"break",    offset:25, duration:10, leadSec:4 },
    { name:"حصة نشاط تجريبية",    type:"activity", offset:35, duration:23, leadSec:7 }
  ];
  return plan.map(function(p, idx){
    return {
      name:p.name, type:p.type, id:"demo-"+idx,
      startMs: base + p.offset*1000, endMs: base + (p.offset+p.duration)*1000,
      leadSec: p.leadSec, personal: p.personal || null
    };
  });
}

/* ============ .ics calendar export (native OS alarms fallback) ============ */

function icsPad(n){ return n < 10 ? "0"+n : ""+n; }

// Asia/Riyadh has a fixed UTC+3 offset year-round (no DST), so converting to
// the UTC timestamps .ics needs is a plain 3-hour subtraction — no VTIMEZONE
// block required for correct alarms in any calendar app.
function icsDateUTC(y, m, d, hh, mm){
  var dt = new Date(Date.UTC(y, m, d, hh, mm, 0));
  dt.setUTCHours(dt.getUTCHours() - 3);
  return dt.getUTCFullYear() + icsPad(dt.getUTCMonth()+1) + icsPad(dt.getUTCDate()) + "T" +
    icsPad(dt.getUTCHours()) + icsPad(dt.getUTCMinutes()) + "00Z";
}
function icsNextDateForWeekday(base, weekday){
  var d = new Date(base.getFullYear(), base.getMonth(), base.getDate());
  var diff = (weekday - d.getDay() + 7) % 7;
  d.setDate(d.getDate() + diff);
  return d;
}
function icsEscape(s){
  return String(s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");
}

function buildICS(schedule, teacherSchedule){
  var BYDAY = ["SU","MO","TU","WE","TH"];
  var base = riyadhNow();
  var stamp = icsDateUTC(base.getFullYear(), base.getMonth(), base.getDate(), base.getHours(), base.getMinutes());
  var lines = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Meeqat//Teacher Schedule//AR","CALSCALE:GREGORIAN","METHOD:PUBLISH"];
  WEEKDAYS.forEach(function(wd){
    var periods = periodsForWeekday(schedule, wd);
    var occ = icsNextDateForWeekday(base, wd);
    periods.forEach(function(ev, pIdx){
      var slot = teacherSchedule && teacherSchedule[wd] ? teacherSchedule[wd][pIdx] : null;
      if(slot && slot.isEmpty) return; // teacher marked this period as free — no alarm needed
      var subj = slot && (slot.subject||"").trim(), cls = slot && (slot.className||"").trim();
      var title = (subj && cls) ? ("حصة " + subj + " — " + cls) : ev.name;
      var sp = ev.start.split(":"), ep = ev.end.split(":");
      var dtStart = icsDateUTC(occ.getFullYear(), occ.getMonth(), occ.getDate(), +sp[0], +sp[1]);
      var dtEnd = icsDateUTC(occ.getFullYear(), occ.getMonth(), occ.getDate(), +ep[0], +ep[1]);
      var uid = "meeqat-" + wd + "-" + pIdx + "-" + Math.random().toString(36).slice(2) + "@meeqat.app";
      lines.push("BEGIN:VEVENT");
      lines.push("UID:" + uid);
      lines.push("DTSTAMP:" + stamp);
      lines.push("DTSTART:" + dtStart);
      lines.push("DTEND:" + dtEnd);
      lines.push("RRULE:FREQ=WEEKLY;BYDAY=" + BYDAY[wd]);
      lines.push("SUMMARY:" + icsEscape(title));
      lines.push("BEGIN:VALARM");
      lines.push("ACTION:DISPLAY");
      lines.push("DESCRIPTION:" + icsEscape("تبقّى 5 دقائق على نهاية " + title));
      lines.push("TRIGGER;RELATED=END:-PT5M");
      lines.push("END:VALARM");
      lines.push("BEGIN:VALARM");
      lines.push("ACTION:DISPLAY");
      lines.push("DESCRIPTION:" + icsEscape("انتهت " + title));
      lines.push("TRIGGER;RELATED=END:PT0S");
      lines.push("END:VALARM");
      lines.push("END:VEVENT");
    });
  });
  lines.push("END:VCALENDAR");
  return lines.join("\r\n");
}

function downloadICS(schedule, teacherSchedule){
  try{
    var content = buildICS(schedule, teacherSchedule);
    var blob = new Blob([content], { type:"text/calendar;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "meeqat-schedule.ics";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ try{ document.body.removeChild(a); URL.revokeObjectURL(url); }catch(e){} }, 1200);
    return true;
  }catch(e){ return false; }
}

/* ============ audio & vibration ============ */

function makeSound(){
  var ctx = null;
  function ensure(){
    if(!ctx){
      try{ var C = window.AudioContext || window.webkitAudioContext; ctx = new C(); }catch(e){ ctx = null; }
    }
    if(ctx && ctx.state === "suspended"){ ctx.resume().catch(function(){}); }
    return ctx;
  }
  function tone(freqs, opts){
    opts = opts || {};
    var c = ensure(); if(!c) return;
    var t = c.currentTime;
    var dur = opts.dur || 0.16, gap = opts.gap != null ? opts.gap : dur + 0.06, vol = opts.vol || 0.22;
    freqs.forEach(function(f){
      var osc = c.createOscillator(), gain = c.createGain();
      osc.type = opts.wave || "sine";
      osc.frequency.value = f;
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.linearRampToValueAtTime(vol, t + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(gain); gain.connect(c.destination);
      osc.start(t); osc.stop(t + dur + 0.03);
      t += gap;
    });
  }
  return {
    unlock: ensure,
    lead: function(){ tone([880, 1174.7, 880], { dur:0.2, gap:0.2, vol:0.75, wave:"triangle" }); },
    end: function(){ tone([1318.5, 1318.5, 1318.5, 1318.5], { dur:0.3, gap:0.32, vol:0.9, wave:"triangle" }); },
    tap: function(){ tone([660], { dur:0.1, gap:0.12, vol:0.4 }); }
  };
}

function vibrate(pattern, on){
  if(!on) return;
  try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){}
}

/* ============ background keep-alive (silent audio loop) ============
   Mobile OSes throttle/suspend a tab's JS timers once the screen locks or
   the browser is backgrounded, which would silently stop the countdown and
   the alert checkpoints. A continuously-playing (silent) audio stream is
   the standard trick browsers respect as "this page still needs to run":
   a looping AudioContext buffer source for Chrome/Android, plus a looping
   <audio> element (more reliable on iOS Safari specifically) using a tiny
   silent WAV. This raises the odds background alerts keep firing — it is
   not a guarantee, since the OS can still suspend the tab outright, which
   is why the .ics calendar sync exists as a native-alarm fallback. */
function makeKeepAlive(){
  var ctx = null, src = null, gainNode = null, audioEl = null;
  function ensureCtx(){
    try{
      var C = window.AudioContext || window.webkitAudioContext;
      if(!ctx) ctx = new C();
      if(ctx.state === "suspended") ctx.resume().catch(function(){});
    }catch(e){ ctx = null; }
    return ctx;
  }
  function start(){
    var c = ensureCtx();
    if(c && !src){
      try{
        var buffer = c.createBuffer(1, c.sampleRate, c.sampleRate);
        src = c.createBufferSource();
        src.buffer = buffer;
        src.loop = true;
        gainNode = c.createGain();
        gainNode.gain.value = 0.0001;
        src.connect(gainNode); gainNode.connect(c.destination);
        src.start(0);
      }catch(e){}
    }
    try{
      if(!audioEl){
        audioEl = document.createElement("audio");
        audioEl.loop = true;
        audioEl.setAttribute("playsinline", "");
        audioEl.volume = 0.01;
        audioEl.src = SILENT_WAV;
        audioEl.style.display = "none";
        document.body.appendChild(audioEl);
      }
      var p = audioEl.play();
      if(p && p.catch) p.catch(function(){});
    }catch(e){}
  }
  function resume(){
    ensureCtx();
    try{ if(audioEl && audioEl.paused){ var p = audioEl.play(); if(p && p.catch) p.catch(function(){}); } }catch(e){}
  }
  function stop(){
    try{ if(src){ src.stop(); src.disconnect(); } }catch(e){}
    src = null;
    try{ if(audioEl){ audioEl.pause(); } }catch(e){}
  }
  return { start: start, resume: resume, stop: stop };
}

/* ============ Arabic voice announcements (Web Speech API) ============ */

function makeVoice(){
  var supported = typeof window !== "undefined" && "speechSynthesis" in window;
  var cache = [];
  function refresh(){
    try{ cache = window.speechSynthesis.getVoices() || []; }catch(e){ cache = []; }
  }
  if(supported){
    refresh();
    try{ window.speechSynthesis.onvoiceschanged = refresh; }catch(e){}
  }
  function pickVoice(){
    var arabic = cache.filter(function(v){ return /^ar/i.test(v.lang || ""); });
    if(!arabic.length) return null;
    var saudi = arabic.filter(function(v){ return /ar-sa/i.test(v.lang || ""); });
    return saudi[0] || arabic[0];
  }
  return {
    supported: supported,
    warmUp: refresh,
    speak: function(text){
      if(!supported) return false;
      try{
        window.speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(text);
        u.lang = "ar-SA";
        var v = pickVoice();
        if(v) u.voice = v;
        u.rate = 0.95; u.pitch = 1; u.volume = 1;
        window.speechSynthesis.speak(u);
        return true;
      }catch(e){ return false; }
    }
  };
}

/* ============ screen wake lock ============ */

function acquireWakeLock(ref){
  try{
    if(!("wakeLock" in navigator)) return Promise.resolve(null);
    return navigator.wakeLock.request("screen").then(function(lock){
      ref.current = lock;
      try{
        lock.addEventListener("release", function(){ if(ref.current === lock) ref.current = null; });
      }catch(e){}
      return lock;
    }).catch(function(){ return null; });
  }catch(e){ return Promise.resolve(null); }
}
function releaseWakeLock(ref){
  try{
    if(ref.current){ ref.current.release().catch(function(){}); ref.current = null; }
  }catch(e){ ref.current = null; }
}

/* ============ small UI pieces ============ */

function ProgressRing(props){
  var size = 196, sw = 14, r = (size - sw) / 2, c = 2 * Math.PI * r;
  var frac = Math.max(0, Math.min(1, props.fraction));
  var off = c * (1 - frac);
  return h("div", { className:"ring-wrap" },
    h("svg", { viewBox: "0 0 " + size + " " + size },
      h("circle", { cx:size/2, cy:size/2, r:r, fill:"none", stroke:"var(--border)", strokeWidth:sw }),
      h("circle", {
        cx:size/2, cy:size/2, r:r, fill:"none",
        stroke: props.alerting ? "var(--amber)" : "var(--accent)",
        strokeWidth:sw, strokeLinecap:"round",
        strokeDasharray: c, strokeDashoffset: off,
        style:{ transition:"stroke-dashoffset .4s linear, stroke .3s" }
      })
    ),
    h("div", { className:"ring-center" },
      h("div", { className:"timer" }, props.timerText),
      h("div", { className:"label" }, props.subText)
    )
  );
}

function IconBtn(props){
  var cls = "icon-btn" + (props.active ? " active" : "") + (props.mutedStyle ? " muted" : "");
  return h("button", { className:cls, onClick:props.onClick, title:props.title, "aria-label":props.title }, props.children);
}

function EventArea(props){
  var ev = props.event, next = props.next, nowMs = props.nowMs, alerting = props.alerting;
  var meta = TYPE_META[ev.type] || TYPE_META.period;
  var frac = (nowMs - ev.startMs) / (ev.endMs - ev.startMs);
  var remain = ev.endMs - nowMs;
  return h(React.Fragment, null,
    h("div", { className:"event-card" + (alerting ? " alerting" : "") },
      h("div", { className:"type-chip" }, meta.icon + " " + meta.label),
      h(ProgressRing, {
        fraction: frac, alerting: alerting,
        timerText: fmtCountdown(remain),
        subText: alerting ? "قارب على الانتهاء" : "الوقت المتبقي"
      }),
      h("div", { className:"event-name" }, ev.name),
      ev.personal ? h("div", { className:"event-personal" }, ev.personal.subject + " · " + ev.personal.className) : null
    ),
    h("div", { className:"next-strip" },
      h("div", null,
        h("div", { className:"lbl" }, next ? "التالي" : "آخر حدث اليوم"),
        h("div", { className:"val" }, next ? next.name : "لا مزيد بعد هذا الحدث")

      next ? h("div", { className:"time" }, next.start || fmtCountdown(next.startMs - nowMs)) : null
    )

}

    onChange(next);
  }
  function remove(idx){ onChange(events.filter(function(_,i){ return i!==idx; })); }

    events.map(function(ev, idx){

/* ============ app ============ */

function App(){
  var startedState = useState(false); var started = startedState[0], setStarted = startedState[1];
  var nowState = useState(riyadhNow()); var now = nowState[0], setNow = nowState[1];
  var schedState = useState(loadSchedule()); var schedule = schedState[0], setSchedule = schedState[1];
  var settState = useState(loadSettings()); var settings = settState[0], setSettings = settState[1];
  var settingsOpenState = useState(false); var settingsOpen = settingsOpenState[0], setSettingsOpen = settingsOpenState[1];
  var demoState = useState(false); var demoMode = demoState[0], setDemoMode = demoState[1];
  var overlayState = useState(null); var overlay = overlayState[0], setOverlay = overlayState[1];
  var teacherState = useState(loadTeacherSchedule()); var teacherSchedule = teacherState[0], setTeacherSchedule = teacherState[1];
  var viewState = useState("home"); var view = viewState[0], setView = viewState[1];

  var demoEventsRef = useRef(null);
  var alertMapRef = useRef({});
  var soundRef = useRef(null);
  var voiceRef = useRef(null);
  var wakeLockRef = useRef(null);
  var overlayTimerRef = useRef(null);
  var keepAliveRef = useRef(null);

  if(!soundRef.current) soundRef.current = makeSound();
  if(!voiceRef.current) voiceRef.current = makeVoice();
  if(!keepAliveRef.current) keepAliveRef.current = makeKeepAlive();

  // self-correcting tick loop, aligned to wall-clock seconds using Date.now() —
  // avoids drift from throttled/queued setInterval callbacks in background tabs
  useEffect(function(){
    var timerId = null;
    function schedule(){
      var delay = 1000 - (Date.now() % 1000);
      timerId = setTimeout(function(){
        setNow(riyadhNow());
        schedule();
      }, delay);
    }
    schedule();
    return function(){ if(timerId) clearTimeout(timerId); };
  }, []);

  // when the tab/screen comes back to the foreground, resync immediately
  // instead of waiting for the next tick, and re-acquire the wake lock
  // (the browser force-releases it whenever the document is hidden)
  useEffect(function(){
    function onVisible(){
      if(!document.hidden){
        setNow(riyadhNow());
        if(started && settings.wakeLockOn) acquireWakeLock(wakeLockRef);
        if(started) keepAliveRef.current.resume();
      }
    }
    document.addEventListener("visibilitychange", onVisible);
    return function(){ document.removeEventListener("visibilitychange", onVisible); };
  }, [started, settings.wakeLockOn]);

  useEffect(function(){ saveSettings(settings); }, [settings]);
  useEffect(function(){ saveSchedule(schedule); }, [schedule]);
  useEffect(function(){ saveTeacherSchedule(teacherSchedule); }, [teacherSchedule]);

  var liveBuilt = buildTodayEvents(schedule, now, teacherSchedule);
  var dayKey = liveBuilt.key;
  var liveEvents = liveBuilt.events;
  var activeEvents = demoMode ? (demoEventsRef.current || []) : liveEvents;
  var nowMs = now.getTime();
  var currentEvent = null, nextEvent = null;
  for(var i=0;i<activeEvents.length;i++){
    var e = activeEvents[i];
    if(nowMs >= e.startMs && nowMs < e.endMs){ currentEvent = e; nextEvent = activeEvents[i+1] || null; break; }
    if(nowMs < e.startMs){ nextEvent = e; break; }
  }
  // voice/visual checkpoints before the end of an event: a first "far" heads-up
  // at 5 minutes remaining, then the configurable lead-time checkpoint (3-5 min).
  // demo mode uses second-scale equivalents so the whole cycle plays in seconds.
  function checkpointsFor(ev){
    if(demoMode) return [{ amount:12, unit:"sec" }, { amount:(ev.leadSec||6), unit:"sec" }];
    var list = [{ amount:5, unit:"min" }];
    if(settings.leadMinutes !== 5) list.push({ amount: settings.leadMinutes, unit:"min" });
    return list;
  }
  function checkpointMs(cp){ return cp.unit === "sec" ? cp.amount*1000 : cp.amount*60000; }
  function checkpointLabel(cp){ return cp.unit === "sec" ? arabicSeconds(cp.amount) : arabicMinutes(cp.amount); }

  var isAlerting = false, remainMs = 0;
  if(currentEvent){
    remainMs = currentEvent.endMs - nowMs;
    var cps = checkpointsFor(currentEvent);
    var maxLeadMs = Math.max.apply(null, cps.map(checkpointMs));
    isAlerting = remainMs <= maxLeadMs;
  }

  // acquire/release the screen wake lock while a period is actually running
  useEffect(function(){
    releaseWakeLock(wakeLockRef);
    if(started && settings.wakeLockOn && currentEvent){
      acquireWakeLock(wakeLockRef);
    }
  }, [started, settings.wakeLockOn, currentEvent && currentEvent.id]);
  useEffect(function(){
    return function(){ releaseWakeLock(wakeLockRef); keepAliveRef.current.stop(); };
  }, []);

  // reset per-event alert tracking when the active list identity changes
  useEffect(function(){ alertMapRef.current = {}; }, [dayKey, demoMode, schedule, settings.leadMinutes]);

  // scan for checkpoint/end alert transitions every tick
  useEffect(function(){
    var built = demoMode ? (demoEventsRef.current || []) : buildTodayEvents(schedule, now, teacherSchedule).events;
    var nm = now.getTime();
    built.forEach(function(ev, idx){
      var state = alertMapRef.current[ev.id] || {};
      var allowed = demoMode ? true : !!settings.alertsByType[ev.type];

      if(nm >= ev.endMs){
        if(!state.ended){
          state.ended = true;
          if(allowed){
            if(settings.soundOn) soundRef.current.end();
            var endText = ev.personal
              ? ("انتهت حصة " + ev.personal.subject + " للصف " + ev.personal.className + "، شكراً لجهودكم")
              : ("انتهت " + ev.name + "، شكرًا لجهودكم");
            if(settings.voiceOn){
              setTimeout(function(){ voiceRef.current.speak(endText); }, 480);
            }
            vibrate(VIBE_END, settings.vibrationOn);
            notifyBanner("ميقات — انتهى الوقت", ev.personal ? (ev.personal.subject + " — " + ev.personal.className) : ("انتهت " + ev.name));
            var nxt = built[idx+1] || null;
            setOverlay({ type:"ended", event: ev, next: nxt });
            if(overlayTimerRef.current) clearTimeout(overlayTimerRef.current);
            overlayTimerRef.current = setTimeout(function(){
              setOverlay(function(o){ return (o && o.type === "ended" && o.event.id === ev.id) ? null : o; });
            }, 4000);
          }
        }
      } else {
        checkpointsFor(ev).forEach(function(cp){
          var cpId = "v" + cp.unit + cp.amount;
          var thresholdMs = ev.endMs - checkpointMs(cp);
          if(thresholdMs < ev.startMs) return; // checkpoint longer than the event itself
          if(nm >= thresholdMs && !(state.cps && state.cps[cpId])){
            state.cps = state.cps || {};
            state.cps[cpId] = true;
            if(allowed){
              if(settings.soundOn) soundRef.current.lead();
              var label = checkpointLabel(cp);
              var leadText = ev.personal
                ? ("تنبيه: تبقى " + label + " على نهاية حصة " + ev.personal.subject + " للصف " + ev.personal.className)
                : ("تنبيه: تبقى " + label + " على نهاية " + ev.name);
              if(settings.voiceOn){
                setTimeout(function(){ voiceRef.current.speak(leadText); }, 420);
              }
              vibrate(VIBE_LEAD, settings.vibrationOn);
              notifyBanner("ميقات — اقترب الوقت", (ev.personal ? (ev.personal.subject + " — " + ev.personal.className) : ev.name) + " — متبقٍ " + checkpointLabel(cp));
              setOverlay({ type:"ending", event: ev, remainMs: ev.endMs - nm });
              if(overlayTimerRef.current) clearTimeout(overlayTimerRef.current);
              overlayTimerRef.current = setTimeout(function(){
                setOverlay(function(o){ return (o && o.type === "ending") ? null : o; });
              }, 4000);
            }
          }
        });
      }
      alertMapRef.current[ev.id] = state;
    });
  }, [now, demoMode, schedule, settings]);

  // auto-exit demo after it finishes playing
  useEffect(function(){
    if(demoMode && demoEventsRef.current && demoEventsRef.current.length){
      var last = demoEventsRef.current[demoEventsRef.current.length-1];
      if(now.getTime() > last.endMs + 3000){
        setDemoMode(false); demoEventsRef.current = null;
      }
    }
  }, [now, demoMode]);

  function startApp(){
    setStarted(true);
    soundRef.current.unlock();
    soundRef.current.tap();
    voiceRef.current.warmUp();
    requestNotifPermission();
    if(settings.wakeLockOn) acquireWakeLock(wakeLockRef);
    keepAliveRef.current.start();
  }
  function testSoundAndVoice(){
    // always runs, regardless of the mute/voice toggles — its whole purpose
    // is to unlock and verify audio permissions on this device
    soundRef.current.unlock();
    soundRef.current.tap();
    vibrate([80, 60, 80], true);
    setTimeout(function(){ voiceRef.current.speak("هذا اختبار للصوت والنطق في تطبيق ميقات"); }, 350);
  }
  function startDemo(){
    demoEventsRef.current = buildDemoEvents(riyadhNow());
    alertMapRef.current = {};
    setOverlay(null);
    setDemoMode(true);
    setSettingsOpen(false);
    setView("home");
  }
  function stopDemo(){
    setDemoMode(false);
    demoEventsRef.current = null;
    setOverlay(null);
  }
  function toggleMute(){
    var next = !settings.soundOn;
    setSettings(Object.assign({}, settings, { soundOn: next, voiceOn: next }));
  }

  if(!started){
    return h("div", { className:"frame" },
      h("div", { className:"gate" },
        h("div", { className:"gate-school" },
          h("img", { src: SCHOOL_LOGO, alt:"شعار مدارس العمرية الأهلية" }),
          h("div", { className:"name" }, "مدارس العمرية الأهلية")
        ),
        h("div", { className:"gate-main" },
          h("div", { className:"mark" }, "🔔"),
          h("h1", null, "ميقات"),
          h("p", null, "المساعد الذكي لإدارة الحصص المدرسية — عدّاد وتنبيهات صوتية تلقائية حسب جدولك الرسمي."),
          h("button", { className:"go", onClick:startApp }, "ابدأ"),
          h("div", { className:"hint" }, "يفعّل الضغط الصوت والاهتزاز لهذه الجلسة"),
          h("div", { className:"credits" },
            h("div", { className:"item principal" }, h("div", { className:"lbl" }, "مدير المدرسة"), h("div", { className:"val" }, "الأستاذ معتز الشامخ")),
            h("div", { className:"item" }, h("div", { className:"lbl" }, "فكرة البرنامج"), h("div", { className:"val" }, "الأستاذ محمود مهران")),
            h("div", { className:"item" }, h("div", { className:"lbl" }, "تنفيذ البرنامج"), h("div", { className:"val" }, "الأستاذ فتحي سيف النصر"))
          )
        ),
        h("div", { className:"gate-footer" }, "جميع الحقوق محفوظة لمدارس العمرية الأهلية © 2026")
      )
    );
  }

  var mainContent;
  if(demoMode){
    if(currentEvent){
      mainContent = h(EventArea, { event: currentEvent, next: nextEvent, nowMs: nowMs, alerting: isAlerting });
    } else {
      mainContent = h(StateScreen, {
        icon:"⏳", iconBg:"var(--violet-soft)", iconColor:"var(--violet)",
        title:"جارٍ إنهاء العرض التجريبي…", desc:"سيعود التطبيق تلقائيًا للوضع المباشر خلال لحظات."
      });
    }
  } else if(dayKey === null){
    mainContent = h(StateScreen, {
      icon:"🌤️", iconBg:"var(--accent-soft)", iconColor:"var(--accent)",
      title:"عطلة نهاية الأسبوع", desc:"لا توجد حصص دراسية اليوم (الجمعة والسبت). عد يوم الأحد.",
      onDemo:startDemo
    });
  } else if(!currentEvent && nextEvent){
    var isFirst = liveEvents.length && nextEvent.id === liveEvents[0].id;
    mainContent = h(StateScreen, {
      icon: isFirst ? "🚩" : "⏳", iconBg:"var(--accent-soft)", iconColor:"var(--accent)",
      title: isFirst ? "الدوام لم يبدأ بعد" : "بانتظار الحدث التالي",
      desc: nextEvent.name + " — الساعة " + nextEvent.start,
      countdown: fmtCountdown(nextEvent.startMs - nowMs),
      onDemo:startDemo
    });
  } else if(!currentEvent && !nextEvent){
    mainContent = h(StateScreen, {
      icon:"✅", iconBg:"var(--accent-soft)", iconColor:"var(--accent)",
      title:"انتهى الدوام الدراسي لليوم", desc:"جميع حصص اليوم اكتملت. نراك في اليوم الدراسي القادم.",
      onDemo:startDemo
    });
  } else {
    mainContent = h(EventArea, { event: currentEvent, next: nextEvent, nowMs: nowMs, alerting: isAlerting });
  }

  return h("div", { className:"frame" },
    h("div", { className:"header" },
      h("div", null,
        h("div", { className:"brand" }, h("span", { className:"dot" }), h("b", null, "ميقات")),
        h("div", { className:"clock" }, fmtClock(now) + (demoMode ? " · تجريبي" : ""))
      ),
      h("div", { className:"actions" },
        h(IconBtn, { title: demoMode ? "إنهاء التجربة" : "تجربة توضيحية", active:demoMode, onClick: demoMode ? stopDemo : startDemo }, demoMode ? "■" : "▶"),
        h(IconBtn, {
          title: settings.wakeLockOn ? "إبقاء الشاشة نشطة أثناء الحصص — مفعّل" : "إبقاء الشاشة نشطة أثناء الحصص — متوقف",
          active: settings.wakeLockOn,
          onClick:function(){ setSettings(Object.assign({}, settings, { wakeLockOn: !settings.wakeLockOn })); }
        }, settings.wakeLockOn ? "🔆" : "🌙"),
        h(IconBtn, { title: settings.soundOn ? "كتم الصوت" : "تفعيل الصوت", mutedStyle: !settings.soundOn, onClick:toggleMute }, settings.soundOn ? "🔊" : "🔇"),
        h(IconBtn, {
          title:"جدولي الخاص", active: view === "myschedule",
          onClick:function(){ if(demoMode) stopDemo(); setView(view === "myschedule" ? "home" : "myschedule"); }
        }, "📋"),
        h(IconBtn, { title:"الإعدادات", onClick:function(){ setSettingsOpen(true); } }, "⚙️")
      )
    ),

    overlay && overlay.type === "ending" ? h(EndingBanner, { event: overlay.event, remainMs: overlay.remainMs }) : null,

    h("div", { className:"content" },
      view === "myschedule"
        ? h(MyScheduleTab, { schedule:schedule, teacherSchedule:teacherSchedule, setTeacherSchedule:setTeacherSchedule })
        : h(React.Fragment, null,
            demoMode ? h("div", { className:"demo-strip" },
              h("span", null, "▶ وضع العرض التجريبي — يعرض دورة كاملة من التنبيهات خلال ثوانٍ"),
              h("button", { onClick:stopDemo }, "إنهاء")
            ) : null,
            mainContent
          )
    ),

    view === "home" ? h("div", { className:"foot-note" }, "معاينة تفاعلية كاملة الوظائف. يحاول التطبيق إبقاء تشغيله في الخلفية عبر بث صوتي صامت مستمر، لكن نظام الجوال قد يوقفه بعد إغلاق التطبيق تمامًا أو تبديل التطبيقات — لضمان لا يفوّت أبدًا استخدم مزامنة التقويم (iCal) من «جدولي الخاص» 📋.") : null,

    overlay && overlay.type === "ended" ? h(EndedOverlay, { event: overlay.event, next: overlay.next, onClose:function(){ setOverlay(null); } }) : null,
    settingsOpen ? h(SettingsModal, { settings:settings, setSettings:setSettings, schedule:schedule, setSchedule:setSchedule, onClose:function(){ setSettingsOpen(false); }, onTest:testSoundAndVoice }) : null
  );
}

var root = ReactDOM.createRoot(document.getElementById("root"));
root.render(h(App));

})();
</script>
